<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마켓맵</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  :root { --bg:#111418; --panel:#1a1f26; --text:#e6e8eb; --muted:#8b939e; --line:#2a313a; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:4px 8px; border-bottom:1px solid var(--line); }
  .grp { display:flex; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .grp button { background:none; border:0; color:var(--muted); padding:3px 9px; font-size:12px; cursor:pointer; font-family:inherit; }
  .grp button.on { background:var(--accent); color:#fff; }
  .meta { margin-left:auto; font-size:11px; color:var(--muted); text-align:right; }
  .legend { display:flex; align-items:center; gap:2px; font-size:11px; color:var(--muted); }
  .legend span.c { width:22px; height:12px; display:inline-block; }
  .crumbs { position:absolute; top:34px; left:8px; font-size:11px; color:var(--muted); }
  .crumbs a { color:var(--text); cursor:pointer; text-decoration:underline; }
  #chart { position:absolute; top:50px; left:0; right:0; bottom:0; }
  /* 캡처용(?shot=1): 버튼 줄 대신 흰 제목 띠(검정 글씨), 글씨 한 단계 크게 */
  #band { display:none; }
  body.shot header, body.shot .crumbs { display:none; }
  body.shot #band { display:flex; align-items:center; gap:16px; height:44px; padding:0 14px; background:#fff; color:#000; }
  body.shot #band .t { font-size:20px; font-weight:700; }
  body.shot #band .legend { color:#000; margin-left:auto; font-size:13px; }
  body.shot #band .b { font-size:13px; }
  body.shot #chart { top:44px !important; }
  @media (max-width: 640px) { .meta { margin-left:0; text-align:left; width:100%; } }
</style>
</head>
<body>
<header>
  <div class="grp" id="mk">
    <button data-v="us" class="on">미장</button>
    <button data-v="kr">국장</button>
  </div>
  <div class="grp" id="pd">
    <button data-v="1D" class="on">1일</button>
    <button data-v="1W">1주</button>
    <button data-v="1M">1개월</button>
    <button data-v="YTD">연초 대비</button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="meta" id="meta">불러오는 중</div>
</header>
<div id="band"><span class="t" id="bandTitle"></span><span class="b" id="bandBasis"></span><span class="legend" id="bandLegend"></span></div>
<div id="crumbs" class="crumbs"></div>
<div id="chart"></div>
<script>
// 데이터: TradingView 스캐너(공식 공개 API 아님). 1분마다 다시 불러온다.
const COL = { "1D": "change", "1W": "Perf.W", "1M": "Perf.1M", "YTD": "Perf.YTD" };
const RANGE = { "1D": 3, "1W": 6, "1M": 12, "YTD": 30 };   // 색이 가장 진해지는 등락률(%)
const LIMIT = { us: 500, kr: 300 };
const SECTOR_KO = {
  "Electronic Technology": "전자기술", "Technology Services": "기술서비스", "Finance": "금융",
  "Health Technology": "헬스케어", "Retail Trade": "소매", "Consumer Non-Durables": "필수소비재",
  "Consumer Durables": "내구소비재", "Producer Manufacturing": "산업재", "Energy Minerals": "에너지",
  "Utilities": "유틸리티", "Communications": "통신", "Transportation": "운송", "Process Industries": "소재와 화학",
  "Non-Energy Minerals": "철강과 금속", "Industrial Services": "산업서비스", "Commercial Services": "상업서비스",
  "Health Services": "헬스케어 서비스", "Consumer Services": "소비자 서비스", "Distribution Services": "유통",
  "Miscellaneous": "기타", "Government": "정부"
};
const IND_KO = {
  "Semiconductors": "반도체", "Packaged Software": "소프트웨어", "Internet Software/Services": "인터넷 서비스",
  "Telecommunications Equipment": "통신장비", "Electronic Production Equipment": "반도체 장비",
  "Computer Processing Hardware": "컴퓨터 하드웨어", "Computer Peripherals": "컴퓨터 주변기기",
  "Electronic Components": "전자부품", "Electrical Products": "전기장비", "Major Banks": "대형 은행",
  "Regional Banks": "지역 은행", "Investment Banks/Brokers": "증권", "Life/Health Insurance": "생명보험",
  "Property/Casualty Insurance": "손해보험", "Multi-Line Insurance": "종합보험", "Financial Conglomerates": "금융지주",
  "Pharmaceuticals: Major": "대형 제약", "Pharmaceuticals: Other": "제약", "Biotechnology": "바이오",
  "Medical Specialties": "의료기기", "Motor Vehicles": "자동차", "Auto Parts: OEM": "자동차 부품",
  "Integrated Oil": "종합 석유", "Oil & Gas Production": "석유가스 생산", "Electric Utilities": "전력",
  "Aerospace & Defense": "항공우주와 방산", "Industrial Machinery": "산업기계", "Trucks/Construction/Farm Machinery": "건설기계",
  "Chemicals: Specialty": "특수화학", "Chemicals: Major Diversified": "종합화학", "Steel": "철강",
  "Internet Retail": "온라인 소매", "Specialty Stores": "전문 소매", "Discount Stores": "할인점",
  "Beverages: Non-Alcoholic": "음료", "Food: Major Diversified": "식품", "Household/Personal Care": "생활용품과 화장품",
  "Cable/Satellite TV": "케이블TV", "Major Telecommunications": "통신사", "Wireless Telecommunications": "무선통신",
  "Movies/Entertainment": "미디어와 엔터", "Restaurants": "외식", "Marine Shipping": "해운", "Airlines": "항공",
  "Engineering & Construction": "건설", "Information Technology Services": "IT 서비스", "Data Processing Services": "데이터 처리",
  "Finance/Rental/Leasing": "여신금융", "Real Estate Investment Trusts": "리츠", "Tobacco": "담배",
  "Apparel/Footwear": "의류와 신발", "Electronics/Appliances": "가전", "Recreational Products": "레저용품",
  "Building Products": "건축자재", "Industrial Conglomerates": "복합기업", "Railroads": "철도",
  "Medical Distributors": "의약품 유통", "Managed Health Care": "건강보험", "Hospital/Nursing Management": "병원",
  "Contract Drilling": "시추", "Oilfield Services/Equipment": "유전 서비스", "Gas Distributors": "가스",
  "Alternative Power Generation": "신재생 발전", "Agricultural Commodities/Milling": "농산물",
  "Containers/Packaging": "포장재",
  "Investment Managers": "자산운용", "Specialty Telecommunications": "특수통신", "Hotels/Resorts/Cruise lines": "호텔과 크루즈",
  "Insurance Brokers/Services": "보험중개", "Food: Specialty/Candy": "특수식품", "Home Improvement Chains": "주택용품 소매",
  "Apparel/Footwear Retail": "의류 소매", "Drugstore Chains": "드럭스토어", "Oil Refining/Marketing": "정유",
  "Oil & Gas Pipelines": "파이프라인", "Electronic Equipment/Instruments": "전자장비", "Air Freight/Couriers": "항공화물과 택배",
  "Other Metals/Minerals": "기타 금속", "Precious Metals": "귀금속", "Environmental Services": "환경 서비스",
  "Wholesale Distributors": "도매", "Financial Publishing/Services": "금융정보 서비스", "Construction Materials": "건자재", "Miscellaneous Commercial Services": "기타 서비스", "Advertising/Marketing Services": "광고"
};
// 국장 실시간 시세 중계(Cloudflare Worker). 비어 있으면 국장도 TradingView 지연 시세만 쓴다
// ?close=1 (또는 캡처용 ?shot=1): 실시간 중계를 끄고 TradingView 정규장 값만 쓴다.
// 장 마감 뒤 네이버 실시간은 시간외·NXT 애프터마켓 가격을 보여 줘서 종가 기준 등락률이 틀어진다.
// TradingView 의 change 는 정규장 종가 기준(한국 KRX 정규장 종가, 미국 정규장 종가)이다(2026-10-30 확인)
const P = new URLSearchParams(location.search);
const SHOT = P.get("shot") === "1";
const CLOSE = SHOT || P.get("close") === "1";
const QUOTE_API = CLOSE ? "" : (P.get("api") || "https://market-map-quotes.dongdongadrie.workers.dev");
let state = { mk: "us", pd: "1D", data: { us: null, kr: null }, at: { us: null, kr: null }, rt: { us: {}, kr: {} }, rtAt: { us: null, kr: null } };
const chart = echarts.init(document.getElementById("chart"), null, { renderer: "canvas" });

function body(mk) {
  const cols = ["name", "description", "sector", "industry", "market_cap_basic", "change", "Perf.W", "Perf.1M", "Perf.YTD", "close", "currency"];
  const f = [{ left: "type", operation: "equal", right: "stock" }, { left: "is_primary", operation: "equal", right: true },
             { left: "subtype", operation: "in_range", right: ["common", "foreign-issuer", ""] }];
  if (mk === "us") f.push({ left: "exchange", operation: "in_range", right: ["NYSE", "NASDAQ", "AMEX"] });
  return JSON.stringify({ columns: cols, filter: f, options: { lang: "ko" }, markets: [mk === "us" ? "america" : "korea"],
    sort: { sortBy: "market_cap_basic", sortOrder: "desc" }, range: [0, LIMIT[mk]] });
}

async function load(mk) {
  const url = `https://scanner.tradingview.com/${mk === "us" ? "america" : "korea"}/scan`;
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain" }, body: body(mk) });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  const seen = new Set();
  const rows = [];
  for (const x of j.data) {
    const d = x.d;
    let name = (mk === "kr" ? d[1] : d[0]) || d[0];
    if (mk === "kr") {
      name = name.replace(/보통주$/, "");
      for (const [a, b] of [["에스케이", "SK"], ["엘지", "LG"], ["에이치디", "HD"], ["케이비", "KB"], ["엘에스", "LS"],
                            ["씨제이", "CJ"], ["지에스", "GS"], ["케이티", "KT"], ["엔에이치", "NH"], ["디비", "DB"],
                            ["비엔케이", "BNK"], ["에이치엘", "HL"], ["케이씨씨", "KCC"], ["에스디", "SD"]])
        if (name.startsWith(a)) { name = b + name.slice(a.length); break; }
    }
    const key = mk === "us" ? (d[1] || "").replace(/ Class [A-C]$/i, "") : d[0];
    if (seen.has(key)) continue;           // 알파벳 A/C 같은 중복 주식 제거
    seen.add(key);
    rows.push({ t: d[0], name, desc: d[1], sec: SECTOR_KO[d[2]] || d[2] || "기타", ind: IND_KO[d[3]] || d[3] || "기타",
      cap: d[4] || 0, "1D": d[5], "1W": d[6], "1M": d[7], "YTD": d[8], close: d[9], cur: d[10] });
  }
  state.data[mk] = rows;
  applyRealtime(mk);
  state.at[mk] = new Date();
}

function color(v, lim) {
  // 미국식(사용자 결정): 상승 초록, 하락 빨강, 보합 회색
  if (v == null || isNaN(v)) return "#3a3f47";
  const t = Math.max(-1, Math.min(1, v / lim));
  const mix = (a, b, k) => a.map((c, i) => Math.round(c + (b[i] - c) * k));
  const grey = [65, 69, 84], green = [48, 204, 90], red = [246, 53, 56];
  const c = t >= 0 ? mix(grey, green, t) : mix(grey, red, -t);
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function fmt(v) { return v == null || isNaN(v) ? "-" : (v > 0 ? "+" : "") + v.toFixed(2) + "%"; }

function tree(rows) {
  const pd = state.pd, lim = RANGE[pd];
  const secs = {};
  for (const r of rows) {
    const s = secs[r.sec] || (secs[r.sec] = {});
    (s[r.ind] || (s[r.ind] = [])).push(r);
  }
  const wavg = (list) => { let w = 0, s = 0; for (const r of list) if (r[pd] != null) { w += r.cap; s += r.cap * r[pd]; } return w ? s / w : null; };
  return Object.entries(secs).map(([sec, inds]) => {
    const all = Object.values(inds).flat();
    const sv = wavg(all);
    return { id: "s:" + sec, sid: "s:" + sec, name: sec, value: all.reduce((a, r) => a + r.cap, 0), chg: sv,
      itemStyle: { color: color(sv, lim) },
      children: Object.entries(inds).map(([ind, list]) => {
        const iv = wavg(list);
        return { id: "i:" + sec + ":" + ind, sid: "s:" + sec, iid: "i:" + sec + ":" + ind, name: ind, value: list.reduce((a, r) => a + r.cap, 0), chg: iv, itemStyle: { color: color(iv, lim) },
          children: list.map(r => ({ id: "t:" + r.t, sid: "s:" + sec, iid: "i:" + sec + ":" + ind, name: r.name, value: r.cap, chg: r[pd], tk: r.t, desc: r.desc, close: r.close, cur: r.cur,
            itemStyle: { color: color(r[pd], lim) } })) };
      }) };
  });
}

function legend() {
  const lim = RANGE[state.pd], el = document.getElementById("legend");
  const steps = [-1, -0.66, -0.33, 0, 0.33, 0.66, 1];
  el.innerHTML = `<span>${-lim}%</span>` + steps.map(s => `<span class="c" style="background:${color(s * lim, lim)}"></span>`).join("") + `<span>+${lim}%</span>`;
}

let path = [];       // 확대해 둔 [업종 id, 산업 id]. 갱신 뒤에도 유지한다
let drawn = null;    // 지금 그려진 시장과 기간. 같으면 데이터만 바꿔 부드럽게 전환

function render() {
  const rows = state.data[state.mk];
  if (!rows) return;
  legend();
  const key = state.mk + state.pd;
  const live = state.rtAt[state.mk];
  const at = live || state.at[state.mk];
  document.getElementById("meta").textContent =
    `${state.mk === "us" ? "미국 시가총액 상위" : "한국 시가총액 상위"} ${rows.length}종목, ${at.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" })} 갱신 (${live ? "실시간 시세" : CLOSE ? "정규장 종가 기준" : (state.mk === "us" ? "15분 지연 시세" : "20분 지연 시세")})`;
  if (SHOT) {
    document.getElementById("bandTitle").textContent = P.get("title") || (state.mk === "us" ? "미국 마켓맵" : "국내 마켓맵");
    document.getElementById("bandBasis").textContent = `시가총액 상위 ${rows.length}종목, ${{ "1D": "1일", "1W": "1주", "1M": "1개월", "YTD": "연초 대비" }[state.pd]} 등락률`;
    document.getElementById("bandLegend").innerHTML = document.getElementById("legend").innerHTML;
  }
  if (drawn === key) {
    // 같은 화면이면 데이터만 바꾼다. 칸 색과 크기가 애니메이션으로 이어진다
    chart.setOption({ series: [{ id: "map", data: view(rows) }] });
    crumbs();
    return;
  }
  drawn = key;
  chart.setOption({
    tooltip: { formatter: (p) => {
      const d = p.data;
      if (d.tk) return `<b>${d.name}</b> (${d.tk})<br>${d.desc || ""}<br>${fmt(d.chg)}<br>현재가 ${d.close?.toLocaleString()} ${d.cur || ""}`;
      return `<b>${d.name}</b><br>시가총액 가중 ${fmt(d.chg)}`;
    } },
    series: [{
      id: "map", type: "treemap", roam: false, nodeClick: false, animationDurationUpdate: 1200, animationEasingUpdate: "cubicInOut", width: "100%", height: "100%", top: 0, bottom: 0, left: 0, right: 0,
      breadcrumb: { show: false },
      leafDepth: 3, visibleMin: 300,
      upperLabel: { show: true, height: SHOT ? 18 : 15, color: "#e6e8eb", fontSize: SHOT ? 12 : 10,
        formatter: (p) => `${p.name}  ${fmt(p.data.chg)}` },
      label: { show: true, color: "#fff", overflow: "truncate", lineHeight: SHOT ? 16 : 13, fontSize: SHOT ? 12 : 10,
        formatter: (p) => `{n|${p.name}}\n${fmt(p.data.chg)}`, rich: { n: { fontWeight: "bold", fontSize: SHOT ? 13 : 11 } } },
      itemStyle: { borderColor: "#111418", borderWidth: 1, gapWidth: 1 },
      levels: [
        { itemStyle: { borderWidth: 0, gapWidth: 3 }, upperLabel: { show: false } },
        { itemStyle: { borderColor: "#111418", borderWidth: 2, gapWidth: 2 }, upperLabel: { show: true } },
        { itemStyle: { borderColor: "#111418", borderWidth: 1, gapWidth: 1 }, upperLabel: { show: true, fontSize: SHOT ? 11 : 10 } },
        { itemStyle: { borderWidth: 0.5, gapWidth: 0 } }
      ],
      data: view(rows)
    }]
  }, true);
  crumbs();
  if (SHOT) chart.on("finished", () => { document.body.dataset.ready = "1"; });
}

function view(rows) {
  // 확대 경로에 맞는 하위 트리만 넘긴다
  let nodes = tree(rows);
  for (const id of path) {
    const n = nodes.find(x => x.id === id);
    if (!n) { path = []; return tree(rows); }
    nodes = n.children;
  }
  return nodes;
}

function crumbs() {
  const el = document.getElementById("crumbs");
  const names = path.map(id => id.split(":").pop());
  el.innerHTML = `<a data-i="0">전체</a>` + names.map((n, i) => ` › <a data-i="${i + 1}">${n}</a>`).join("");
  el.querySelectorAll("a").forEach(a => a.onclick = () => { path = path.slice(0, +a.dataset.i); update(); });
}

function update() {
  const rows = state.data[state.mk];
  if (rows) { chart.setOption({ series: [{ id: "map", data: view(rows) }] }); crumbs(); }
}

chart.on("click", (p) => {
  // 업종, 산업, 종목 어느 칸을 눌러도 한 단계씩 들어간다: 전체 → 업종 → 산업
  const d = p.data;
  if (p.componentType !== "series" || !d || !d.sid) return;
  if (path.length === 0) path = [d.sid];
  else if (path.length === 1 && d.iid) path = [d.sid, d.iid];
  else return;
  update();
});

function applyRealtime(mk) {
  // 1일 등락률과 현재가를 실시간 값으로 덮어쓴다(1주, 1개월, 연초 대비는 TradingView 값 유지)
  for (const r of state.data[mk] || []) {
    const q = state.rt[mk][r.t];
    if (q) { r.close = q[0]; r["1D"] = q[1]; }
  }
}

async function loadRT(mk) {
  const rows = state.data[mk];
  if (!QUOTE_API || !rows) return;
  try {
    const q = mk === "kr" ? "/kr?codes=" : "/us?syms=";
    const r = await fetch(QUOTE_API + q + rows.map(x => x.t).join(","));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    state.rt[mk] = j.d || {};
    state.rtAt[mk] = new Date();
    applyRealtime(mk);
    if (state.mk === mk) render();
  } catch (e) { state.rtAt[mk] = null; }
}

async function refresh(mk) {
  try { await load(mk); if (QUOTE_API) await loadRT(mk); if (mk === state.mk) render(); }
  catch (e) { document.getElementById("meta").textContent = "불러오기 실패, 잠시 뒤 다시 시도: " + e.message; }
}

document.querySelectorAll("#mk button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#mk button").forEach(x => x.classList.toggle("on", x === b));
  state.mk = b.dataset.v; path = []; state.data[state.mk] ? render() : refresh(state.mk);
});
document.querySelectorAll("#pd button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#pd button").forEach(x => x.classList.toggle("on", x === b));
  state.pd = b.dataset.v; render();
});
const q = P;
if (SHOT) document.body.classList.add("shot");
if (COL[q.get("pd")]) {
  state.pd = q.get("pd");
  document.querySelectorAll("#pd button").forEach(b => b.classList.toggle("on", b.dataset.v === state.pd));
}
if (q.get("mk") === "kr") document.querySelector('#mk button[data-v="kr"]').click();
function layout() {
  // 버튼 줄이 창 너비에 따라 한 줄 또는 두 줄이 되므로, 그 높이에 맞춰 지도를 붙인다. 스크롤 없이 창 안에 꽉 차게
  if (SHOT) { chart.resize(); return; }
  const h = document.querySelector("header").offsetHeight;
  document.getElementById("crumbs").style.top = h + 2 + "px";
  document.getElementById("chart").style.top = h + 18 + "px";
  chart.resize();
}
window.addEventListener("resize", layout);
layout();
refresh(state.mk);
// 5초마다 전부 다시 받는다(사용자 결정): TradingView 로 종목 구성, 시가총액, 기간 수익률을 받고
// 실시간 중계가 있으면 가격과 1일 등락률을 실시간 값으로 덮어쓴다
// 캡처용은 한 번만 그린다(갱신 애니메이션 중에 찍히지 않게)
if (!SHOT) setInterval(() => refresh(state.mk), 5000);
</script>
</body>
</html>
